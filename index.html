<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. Security Command Center</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- NOUVO: PeerJS pou pataje kamera a -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    
    <style>
        :root {
            --bg-main: #050a14;
            --panel: rgba(10, 20, 40, 0.95);
            --accent: #00e5ff;
            --text-main: #e6f1ff;
            --text-muted: #8892b0;
            --border: rgba(0, 229, 255, 0.3);
            --danger: #ff5470;
            --success: #00ff9d;
            --gold: #ffc244;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background: rgba(5, 10, 20, 0.95);
            border-bottom: 2px solid var(--border);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            flex-shrink: 0;
        }
        .header-left h1 { font-size: 1.5rem; color: var(--accent); letter-spacing: 2px; }
        .header-right { text-align: right; font-size: 0.85rem; color: var(--text-muted); }
        .header-right strong { color: var(--success); }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr; 
            gap: 15px;
            padding: 15px;
            flex: 1;
            height: calc(100vh - 80px);
            overflow: hidden;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            height: 100%;
        }

        .panel-header {
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 15px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .panel-header h2 { font-size: 0.9rem; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }

        .status-badge {
            font-size: 0.7rem; padding: 4px 10px; border-radius: 12px;
            background: rgba(255, 84, 112, 0.2); color: var(--danger);
            font-weight: bold; border: 1px solid var(--danger);
        }
        .status-badge.active { background: rgba(0, 255, 157, 0.2); color: var(--success); border-color: var(--success); }
        .status-badge.recording { background: rgba(255, 84, 112, 0.2); color: var(--danger); border-color: var(--danger); animation: pulse 1s infinite; }

        #videoContainer, #externalCameraContainer {
            flex: 1; min-height: 0; background: #000;
            display: flex; justify-content: center; align-items: center; position: relative;
        }
        #videoFeed { width: 100%; height: 100%; object-fit: cover; display: none; }
        #externalIframe { width: 100%; height: 100%; border: none; display: none; }
        
        .camera-offline { color: var(--text-muted); text-align: center; font-size: 1rem; padding: 20px; line-height: 1.5; }

        #map { flex: 1; min-height: 0; width: 100%; background: #1a1a1a; }

        .controls {
            padding: 10px 15px; background: rgba(0, 0, 0, 0.6);
            border-top: 1px solid var(--border); display: flex;
            flex-direction: column; gap: 8px; flex-shrink: 0;
        }

        .cam-select, input[type="text"] {
            width: 100%; padding: 8px; border-radius: 6px;
            background: rgba(0,0,0,0.5); color: var(--accent);
            border: 1px solid var(--border); outline: none; font-size: 0.8rem;
        }

        .button-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }

        button {
            width: 100%; background: var(--accent); color: #000;
            border: none; padding: 10px 4px; border-radius: 6px;
            font-weight: bold; cursor: pointer; transition: 0.2s;
            text-transform: uppercase; font-size: 0.75rem;
        }
        button:hover { background: #00b8cc; }
        button.danger { background: var(--danger); color: white; }
        button.warning { background: var(--gold); color: #000; }
        button:disabled { background: var(--text-muted); cursor: not-allowed; }

        .rec-indicator {
            position: absolute; top: 10px; right: 10px; color: var(--danger);
            font-weight: bold; font-size: 0.8rem; display: none;
            background: rgba(0,0,0,0.7); padding: 3px 8px; border-radius: 4px;
            z-index: 100;
        }
        .rec-indicator.active { display: flex; align-items: center; gap: 5px; }
        .rec-dot { width: 8px; height: 8px; background: var(--danger); border-radius: 50%; animation: pulse 1s infinite; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        @media (max-width: 1000px) {
            .dashboard { grid-template-columns: 1fr; overflow-y: auto; }
            .panel { height: 400px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <h1>🛡️ J.A.R.V.I.S. COMMAND CENTER</h1>
        </div>
        <div class="header-right">
            <strong>Operator:</strong> Gesner Deslandes<br>
            Software Engineer · Global Technology.com
        </div>
    </header>

    <div class="dashboard">
        <!-- PANEL 1: USB CAMERA & SHARE -->
        <div class="panel">
            <div class="panel-header">
                <h2>📷 USB Camera</h2>
                <div class="status-badge" id="camStatus">OFFLINE</div>
            </div>
            <div id="videoContainer">
                <div class="camera-offline" id="camOfflineText">
                    Click "Allow & Find Cameras" to start.
                </div>
                <video id="videoFeed" autoplay playsinline muted></video>
                <div class="rec-indicator" id="usbRecIndicator"><div class="rec-dot"></div> REC</div>
            </div>
            <div class="controls">
                <button onclick="requestCameraPermission()" style="background: var(--gold); color: black;">🔐 Allow & Find Cameras</button>
                <select id="cameraSelect" class="cam-select" disabled>
                    <option value="">Please allow permission first...</option>
                </select>
                <div class="button-grid">
                    <button id="btnCam" onclick="toggleCamera()" disabled>Start</button>
                    <button id="btnMute" onclick="toggleMute()" disabled>🔇 Mute</button>
                    <button id="btnRecord" onclick="toggleRecording()" disabled>🔴 Rec</button>
                </div>
                <!-- NOUVO BOUTON POU PATAJE -->
                <button onclick="shareCamera()" id="btnShare" style="background: #8b5cf6; color: white; margin-top: 5px;" disabled>🔗 Share Link with Someone</button>
            </div>
        </div>

        <!-- PANEL 2: EXTERNAL CAMERA -->
        <div class="panel">
            <div class="panel-header">
                <h2>🌐 External Camera</h2>
                <div class="status-badge" id="extStatus">OFFLINE</div>
            </div>
            <div id="externalCameraContainer">
                <div class="camera-offline" id="extOfflineText">
                    Paste External Stream URL here.
                </div>
                <iframe id="externalIframe" allow="autoplay; fullscreen; encrypted-media"></iframe>
            </div>
            <div class="controls">
                <input type="text" id="go2rtcUrl" placeholder="https://...">
                <button id="btnExtStart" onclick="toggleExternalCamera()">Start</button>
            </div>
        </div>

        <!-- PANEL 3: GPS TRACKER -->
        <div class="panel">
            <div class="panel-header">
                <h2>📍 GPS Tracker</h2>
                <div class="status-badge" id="gpsStatus">OFFLINE</div>
            </div>
            <div id="map"></div>
            <div class="controls">
                <button id="btnGpsStart" onclick="toggleGPS()">Start</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. USB CAMERA LOGIC ---
        let videoStream = null;
        const videoElement = document.getElementById('videoFeed');
        const camStatus = document.getElementById('camStatus');
        const btnCam = document.getElementById('btnCam');
        const btnMute = document.getElementById('btnMute');
        const btnRecord = document.getElementById('btnRecord');
        const btnShare = document.getElementById('btnShare');
        const cameraSelect = document.getElementById('cameraSelect');
        const usbRecIndicator = document.getElementById('usbRecIndicator');
        let isMuted = true;

        async function requestCameraPermission() {
            cameraSelect.innerHTML = '<option value="">Requesting permission...</option>';
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                stream.getTracks().forEach(track => track.stop());
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(device => device.kind === 'videoinput');
                cameraSelect.innerHTML = '';
                cameraSelect.disabled = false;
                videoDevices.forEach((device, index) => {
                    const option = document.createElement('option');
                    option.value = device.deviceId;
                    option.text = device.label || `Camera ${index + 1}`;
                    cameraSelect.appendChild(option);
                });
                btnCam.disabled = false;
                document.getElementById('camOfflineText').innerText = "Camera ready. Click Start.";
            } catch (err) { 
                cameraSelect.innerHTML = '<option value="">Permission Denied</option>'; 
                document.getElementById('camOfflineText').innerText = "Please check the camera icon in your URL bar.";
            }
        }

        async function toggleCamera() {
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
                videoElement.srcObject = null;
                videoElement.style.display = 'none';
                document.getElementById('camOfflineText').style.display = 'block';
                camStatus.innerText = "OFFLINE"; camStatus.className = "status-badge";
                btnCam.innerText = "Start"; btnMute.disabled = true; btnRecord.disabled = true; btnShare.disabled = true;
            } else {
                try {
                    videoStream = await navigator.mediaDevices.getUserMedia({ 
                        video: { deviceId: { exact: cameraSelect.value }, width: { ideal: 1280 } }, audio: true 
                    });
                    videoElement.srcObject = videoStream;
                    videoElement.style.display = 'block';
                    document.getElementById('camOfflineText').style.display = 'none';
                    videoElement.muted = true; isMuted = true; btnMute.innerHTML = "🔊 Unmute"; btnMute.disabled = false; btnRecord.disabled = false;
                    btnShare.disabled = false; // Aktive pataje a
                    await videoElement.play();
                    camStatus.innerText = "LIVE"; camStatus.className = "status-badge active";
                    btnCam.innerText = "Stop";
                } catch (err) { 
                    camStatus.innerText = "BUSY/DENIED"; 
                }
            }
        }

        function toggleMute() {
            if (!videoStream) return;
            isMuted = !isMuted; videoElement.muted = isMuted;
            btnMute.innerHTML = isMuted ? "🔊 Unmute" : "🔇 Mute";
        }

        // --- 2. PATAJE KAMERA A AK PEERJS ---
        function shareCamera() {
            if (!videoStream) return;

            // Jenere yon ID inik pou sesyon an
            const roomId = 'JARVIS-' + Math.floor(1000 + Math.random() * 9000);
            
            // Konekte ak sèvè PeerJS gratis la
            const peer = new Peer(roomId);

            peer.on('open', (id) => {
                const shareLink = `https://deslandes1.github.io/ProjectWebcamera2026/viewer.html?id=${id}`;
                
                // Kopye lyen an nan clipboard
                navigator.clipboard.writeText(shareLink).then(() => {
                    alert(`✅ LYEN PATAJE A KOPYE!\n\nVoye lyen sa a bay moun nan:\n${shareLink}\n\n(Pa fèmen paj sa a, sinon koneksyon an ap koupe)`);
                }).catch(() => {
                    prompt("Kopye lyen sa a pou w pataje l:", shareLink);
                });
            });

            // Lè yon moun konekte ak lyen an, voye videyo a ba li
            peer.on('call', (call) => {
                call.answer(videoStream); 
            });
        }

        // --- 3. GPS TRACKER LOGIC ---
        const map = L.map('map').setView([18.5392, -72.3364], 15); 
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 20 }).addTo(map);
        let marker = L.marker([18.5392, -72.3364]).addTo(map);
        
        function toggleGPS() {
            if (document.getElementById('gpsStatus').innerText === "OFFLINE") {
                document.getElementById('gpsStatus').innerText = "LIVE";
                document.getElementById('gpsStatus').className = "status-badge active";
                document.getElementById('btnGpsStart').innerText = "Stop";
            } else {
                document.getElementById('gpsStatus').innerText = "OFFLINE";
                document.getElementById('gpsStatus').className = "status-badge";
                document.getElementById('btnGpsStart').innerText = "Start";
            }
        }

        // External Camera (Placeholder)
        function toggleExternalCamera() {
            const url = document.getElementById('go2rtcUrl').value;
            if(url) {
                document.getElementById('externalIframe').src = url;
                document.getElementById('externalIframe').style.display = 'block';
                document.getElementById('extStatus').innerText = "LIVE";
                document.getElementById('extStatus').className = "status-badge active";
            }
        }
    </script>
</body>
</html>
