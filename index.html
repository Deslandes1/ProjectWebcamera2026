<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. Camera Share</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { background-color: #050a14; color: #e6f1ff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; padding: 20px; text-align: center; }
        h1 { font-size: 1.2rem; color: #00e5ff; }
        p { font-size: 0.9rem; color: #8892b0; margin-bottom: 20px; }
        button { background: #00e5ff; color: #000; border: none; padding: 15px 30px; border-radius: 30px; font-weight: bold; font-size: 1.1rem; cursor: pointer; width: 100%; max-width: 300px; }
        button:disabled { background: #8892b0; cursor: not-allowed; }
        #videoContainer { width: 100%; max-width: 400px; aspect-ratio: 9/16; background: #000; border: 2px solid #00e5ff; border-radius: 12px; overflow: hidden; margin-top: 20px; display: none; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .status { margin-top: 15px; font-weight: bold; color: #ffc244; font-size: 0.9rem;}
    </style>
</head>
<body>
    <h1>🛡️ J.A.R.V.I.S. LIVE SHARE</h1>
    <p>Click the button below to share your camera with J.A.R.V.I.S.</p>
    
    <button id="startBtn" onclick="startStreaming()">📷 Allow Camera & Connect</button>
    <div class="status" id="status">Ready to connect.</div>

    <div id="videoContainer">
        <video id="localVideo" autoplay playsinline muted></video>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const peerId = urlParams.get('id');
        const statusEl = document.getElementById('status');

        // MENM TURN SERVERS YO
        const peerConfig = {
            config: {
                'iceServers': [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
                    { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
                ]
            }
        };

        async function startStreaming() {
            if (!peerId) {
                statusEl.innerText = "Error: No JARVIS ID found in link.";
                statusEl.style.color = "red";
                return;
            }

            const btn = document.getElementById('startBtn');
            btn.disabled = true;
            btn.innerText = "Connecting...";
            statusEl.innerText = "Requesting camera permission...";

            try {
                // 1. Mande pèmisyon
                const localStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' }, 
                    audio: true 
                });

                document.getElementById('videoContainer').style.display = 'block';
                document.getElementById('localVideo').srcObject = localStream;
                statusEl.innerText = "Calling J.A.R.V.I.S....";

                // 2. Kreye Peer epi Rele JARVIS lan
                const peer = new Peer(null, peerConfig);

                peer.on('open', () => {
                    const call = peer.call(peerId, localStream);
                    
                    if (!call) {
                        statusEl.innerText = "Failed to connect.";
                        statusEl.style.color = "red";
                        btn.disabled = false;
                        return;
                    }

                    call.on('stream', (remoteStream) => {
                        statusEl.innerText = "✅ Connected! J.A.R.V.I.S. can see you.";
                        statusEl.style.color = "#00ff9d";
                        btn.innerText = "Connected";
                    });

                    call.on('error', (err) => {
                        statusEl.innerText = "Connection Failed. Please try again.";
                        statusEl.style.color = "red";
                        btn.disabled = false;
                        btn.innerText = "Try Again";
                    });
                });
                
                peer.on('error', (err) => {
                    statusEl.innerText = "Network Error. Please try again.";
                    statusEl.style.color = "red";
                    btn.disabled = false;
                });

            } catch (err) {
                console.error(err);
                statusEl.innerText = "Camera permission denied. Please allow it.";
                statusEl.style.color = "red";
                btn.disabled = false;
                btn.innerText = "Try Again";
            }
        }
    </script>
</body>
</html>
