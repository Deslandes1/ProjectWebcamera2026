<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. Security Command Center</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    
    <style>
        /* Kòd CSS lan rete menm jan an (pa bezwen w manyen l) */
        :root { --bg-main: #050a14; --panel: rgba(10, 20, 40, 0.95); --accent: #00e5ff; --text-main: #e6f1ff; --text-muted: #8892b0; --border: rgba(0, 229, 255, 0.3); --danger: #ff5470; --success: #00ff9d; --gold: #ffc244; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        header { background: rgba(5, 10, 20, 0.95); border-bottom: 2px solid var(--border); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .header-left h1 { font-size: 1.5rem; color: var(--accent); }
        .dashboard { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; padding: 15px; flex: 1; height: calc(100vh - 80px); overflow: hidden; }
        .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; height: 100%; }
        .panel-header { background: rgba(0, 0, 0, 0.4); padding: 10px 15px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
        .panel-header h2 { font-size: 0.9rem; color: var(--accent); }
        .status-badge { font-size: 0.7rem; padding: 4px 10px; border-radius: 12px; background: rgba(255, 84, 112, 0.2); color: var(--danger); font-weight: bold; border: 1px solid var(--danger); }
        .status-badge.active { background: rgba(0, 255, 157, 0.2); color: var(--success); border-color: var(--success); }
        #videoContainer, #externalCameraContainer { flex: 1; min-height: 0; background: #000; display: flex; justify-content: center; align-items: center; position: relative; }
        #videoFeed { width: 100%; height: 100%; object-fit: cover; display: none; }
        .camera-offline { color: var(--text-muted); text-align: center; padding: 20px; }
        .controls { padding: 10px 15px; background: rgba(0, 0, 0, 0.6); border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
        .cam-select, input[type="text"] { width: 100%; padding: 8px; border-radius: 6px; background: rgba(0,0,0,0.5); color: var(--accent); border: 1px solid var(--border); outline: none; font-size: 0.8rem; }
        .button-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
        button { width: 100%; background: var(--accent); color: #000; border: none; padding: 10px 4px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.75rem; }
        button:hover { background: #00b8cc; }
        button.danger { background: var(--danger); color: white; }
        button.warning { background: var(--gold); color: #000; }
        button:disabled { background: var(--text-muted); cursor: not-allowed; }
        #map { flex: 1; min-height: 0; width: 100%; }
        .header-right { text-align: right; font-size: 0.85rem; color: var(--text-muted); }
        .header-right strong { color: var(--success); }
    </style>
</head>
<body>
    <header>
        <div class="header-left"><h1>🛡️ J.A.R.V.I.S. COMMAND CENTER</h1></div>
        <div class="header-right"><strong>Operator:</strong> Gesner Deslandes<br>Software Engineer</div>
    </header>

    <div class="dashboard">
        <div class="panel">
            <div class="panel-header"><h2>📷 USB Camera</h2><div class="status-badge" id="camStatus">OFFLINE</div></div>
            <div id="videoContainer">
                <div class="camera-offline" id="camOfflineText">Click "Allow & Find Cameras" to start.</div>
                <video id="videoFeed" autoplay playsinline muted></video>
            </div>
            <div class="controls">
                <button onclick="requestCameraPermission()" style="background: var(--gold); color: black;">🔐 Allow & Find Cameras</button>
                <select id="cameraSelect" class="cam-select" disabled><option value="">Please allow permission first...</option></select>
                <div class="button-grid">
                    <button id="btnCam" onclick="toggleCamera()" disabled>Start</button>
                    <button id="btnMute" onclick="toggleMute()" disabled>🔇 Mute</button>
                    <button id="btnRecord" onclick="toggleRecording()" disabled>🔴 Rec</button>
                </div>
                <button onclick="shareCamera()" id="btnShare" style="background: #8b5cf6; color: white; margin-top: 5px;" disabled>🔗 Share Link with Someone</button>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header"><h2>🌐 External Camera</h2><div class="status-badge" id="extStatus">OFFLINE</div></div>
            <div id="externalCameraContainer">
                <div class="camera-offline" id="extOfflineText">Paste External Stream URL here.</div>
                <iframe id="externalIframe" allow="autoplay; fullscreen; encrypted-media"></iframe>
            </div>
            <div class="controls">
                <input type="text" id="go2rtcUrl" placeholder="https://...">
                <button id="btnExtStart" onclick="toggleExternalCamera()">Start</button>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header"><h2>📍 GPS Tracker</h2><div class="status-badge" id="gpsStatus">OFFLINE</div></div>
            <div id="map"></div>
            <div class="controls"><button id="btnGpsStart" onclick="toggleGPS()">Start</button></div>
        </div>
    </div>

    <script>
        let videoStream = null;
        let isMuted = true;
        const videoElement = document.getElementById('videoFeed');
        const camStatus = document.getElementById('camStatus');
        const btnCam = document.getElementById('btnCam');
        const btnMute = document.getElementById('btnMute');
        const btnRecord = document.getElementById('btnRecord');
        const btnShare = document.getElementById('btnShare');
        const cameraSelect = document.getElementById('cameraSelect');

        // --- CAMERA ACCESS ---
        async function requestCameraPermission() {
            cameraSelect.innerHTML = '<option value="">Requesting permission...</option>';
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                stream.getTracks().forEach(track => track.stop());
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(device => device.kind === 'videoinput');
                cameraSelect.innerHTML = '';
                cameraSelect.disabled = false;
                videoDevices.forEach((device, index) => {
                    const option = document.createElement('option');
                    option.value = device.deviceId;
                    option.text = device.label || `Camera ${index + 1}`;
                    cameraSelect.appendChild(option);
                });
                btnCam.disabled = false;
                document.getElementById('camOfflineText').innerText = "Camera ready. Click Start.";
            } catch (err) { 
                cameraSelect.innerHTML = '<option value="">Permission Denied</option>'; 
                document.getElementById('camOfflineText').innerText = "Please allow camera access in your browser.";
            }
        }

        async function toggleCamera() {
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
                videoElement.srcObject = null;
                videoElement.style.display = 'none';
                document.getElementById('camOfflineText').style.display = 'block';
                camStatus.innerText = "OFFLINE"; camStatus.className = "status-badge";
                btnCam.innerText = "Start"; btnMute.disabled = true; btnRecord.disabled = true; btnShare.disabled = true;
            } else {
                try {
                    videoStream = await navigator.mediaDevices.getUserMedia({ 
                        video: { deviceId: { exact: cameraSelect.value }, width: { ideal: 1280 } }, audio: true 
                    });
                    videoElement.srcObject = videoStream;
                    videoElement.style.display = 'block';
                    document.getElementById('camOfflineText').style.display = 'none';
                    videoElement.muted = true; isMuted = true; btnMute.innerHTML = "🔊 Unmute"; btnMute.disabled = false; btnRecord.disabled = false;
                    btnShare.disabled = false;
                    await videoElement.play();
                    camStatus.innerText = "LIVE"; camStatus.className = "status-badge active";
                    btnCam.innerText = "Stop";
                } catch (err) { camStatus.innerText = "BUSY/DENIED"; }
            }
        }

        function toggleMute() {
            if (!videoStream) return;
            isMuted = !isMuted; videoElement.muted = isMuted;
            btnMute.innerHTML = isMuted ? "🔊 Unmute" : "🔇 Mute";
        }

        function toggleRecording() {
            // Simplikasyon pou kounye a (ou ka mete ansyen kòd record la si w vle)
            alert("Recording feature is under maintenance for the share update.");
        }

        // --- PATAJE AK PEERJS (AK STUN SERVERS) ---
        let peer = null;

        function shareCamera() {
            if (!videoStream) return;

            // Detwi ansyen peer a si li te deja la
            if (peer) peer.destroy();

            // ID inik pou sesyon an
            const roomId = 'JARVIS-' + Math.floor(10000 + Math.random() * 90000);
            
            // KONFIGIRASYON STUN SERVERS (Pou travèse NAT)
            peer = new Peer(roomId, {
                config: {
                    'iceServers': [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' },
                        { urls: 'stun:stun2.l.google.com:19302' },
                        { urls: 'stun:global.stun.twilio.com:3478' }
                    ]
                }
            });

            peer.on('open', (id) => {
                const shareLink = `https://deslandes1.github.io/ProjectWebcamera2026/viewer.html?id=${id}`;
                navigator.clipboard.writeText(shareLink).then(() => {
                    alert(`✅ LYEN PATAJE A KOPYE!\n\nVoye lyen sa a bay moun nan:\n${shareLink}\n\n*(Pa fèmen paj sa a, sinon koneksyon an ap koupe)*`);
                }).catch(() => {
                    prompt("Kopye lyen sa a pou w pataje l:", shareLink);
                });
            });

            // Lè yon moun konekte, voye videyo a ba li
            peer.on('call', (call) => {
                console.log("Moun nan konekte! Ap voye videyo a...");
                call.answer(videoStream); 
            });

            peer.on('error', (err) => {
                console.error("Peer Error:", err);
                alert("Erè koneksyon: " + err.type + ". Eseye relance paj la.");
            });
        }

        // --- GPS & EXTERNAL (Senp) ---
        function toggleExternalCamera() {
            const url = document.getElementById('go2rtcUrl').value;
            if(url) {
                document.getElementById('externalIframe').src = url;
                document.getElementById('externalIframe').style.display = 'block';
                document.getElementById('extStatus').innerText = "LIVE";
                document.getElementById('extStatus').className = "status-badge active";
            }
        }
        const map = L.map('map').setView([18.5392, -72.3364], 15); 
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 20 }).addTo(map);
        function toggleGPS() {
            const s = document.getElementById('gpsStatus');
            s.innerText = s.innerText === "OFFLINE" ? "LIVE" : "OFFLINE";
            s.className = s.innerText === "LIVE" ? "status-badge active" : "status-badge";
        }
    </script>
</body>
</html>
