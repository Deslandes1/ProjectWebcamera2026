<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. Live Viewer</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { background-color: #050a14; color: #e6f1ff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; padding: 20px; text-align: center; }
        h1 { font-size: 1.2rem; color: #00e5ff; letter-spacing: 1px;}
        .status { margin-top: 15px; font-weight: bold; color: #ffc244; font-size: 0.9rem;}
        button { background: #00e5ff; color: #000; border: none; padding: 15px 30px; border-radius: 30px; font-weight: bold; font-size: 1.1rem; cursor: pointer; width: 100%; max-width: 300px; margin-top: 10px;}
        button:disabled { background: #8892b0; cursor: not-allowed; }
        #videoContainer { width: 100%; max-width: 800px; aspect-ratio: 16/9; background: #000; border: 2px solid #00e5ff; border-radius: 12px; overflow: hidden; margin-top: 20px; display: none; position: relative;}
        video { width: 100%; height: 100%; object-fit: contain; }
    </style>
</head>
<body>
    <h1>🛡️ J.A.R.V.I.S. LIVE FEED</h1>
    <p style="color:#8892b0; font-size:0.9rem;">Click below to watch the camera.</p>
    
    <button id="startBtn" onclick="startStreaming()">👁️ Watch Camera</button>
    <div class="status" id="status">Ready.</div>

    <div id="videoContainer">
        <video id="remoteVideo" autoplay playsinline></video>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const peerId = urlParams.get('id');
        const statusEl = document.getElementById('status');

        const peerConfig = {
            config: {
                'iceServers': [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
                    { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
                ]
            }
        };

        async function startStreaming() {
            const btn = document.getElementById('startBtn');
            btn.disabled = true;
            btn.innerText = "Connecting...";
            statusEl.innerText = "Connecting to camera...";

            try {
                let myAudioStream;
                try {
                    myAudioStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                } catch (e) {
                    myAudioStream = new MediaStream();
                    statusEl.innerText = "Mic denied. Watching without talking...";
                }

                const peer = new Peer(null, peerConfig);

                peer.on('open', () => {
                    const call = peer.call(peerId, myAudioStream);
                    
                    call.on('stream', (remoteStream) => {
                        document.getElementById('videoContainer').style.display = 'block';
                        document.getElementById('remoteVideo').srcObject = remoteStream;
                        
                        const videoEl = document.getElementById('remoteVideo');
                        videoEl.play().catch(e => {
                            statusEl.innerText = "Click the video to enable sound.";
                            videoEl.controls = true;
                        });

                        statusEl.innerText = "✅ Connected to Live Camera!";
                        statusEl.style.color = "#00ff9d";
                        btn.innerText = "Connected";
                    });

                    call.on('error', (err) => {
                        statusEl.innerText = "Connection failed. Try again.";
                        statusEl.style.color = "red";
                        btn.disabled = false;
                    });
                });
            } catch (err) {
                console.error(err);
                statusEl.innerText = "Error connecting.";
                statusEl.style.color = "red";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
