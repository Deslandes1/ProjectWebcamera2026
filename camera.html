<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. AI Camera Host</title>
    <style>
        :root { --bg-main: #050a14; --panel: rgba(10, 20, 40, 0.95); --accent: #00e5ff; --text-main: #e6f1ff; --text-muted: #8892b0; --border: rgba(0, 229, 255, 0.3); --danger: #ff5470; --success: #00ff9d; --gold: #ffc244; --purple: #8b5cf6; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        html, body { min-height: 100vh; background-color: var(--bg-main); color: var(--text-main); overflow-x: hidden; overflow-y: auto; }
        body { display: flex; flex-direction: column; }
        header { background: rgba(5, 10, 20, 0.95); border-bottom: 2px solid var(--border); padding: 10px 30px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; position: sticky; top: 0; z-index: 100; }
        .header-left { flex: 1; }
        .header-left h1 { font-size: 1.5rem; color: var(--accent); letter-spacing: 2px; }
        .header-center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .time-display { font-family: 'Courier New', monospace; font-size: 1.8rem; font-weight: 900; color: var(--accent); text-shadow: 0 0 10px rgba(0, 229, 255, 0.5); line-height: 1; letter-spacing: 2px; }
        .date-display { font-size: 0.85rem; color: var(--text-muted); letter-spacing: 1px; margin-top: 5px; text-transform: uppercase; }
        .header-right { flex: 1; text-align: right; font-size: 0.85rem; color: var(--text-muted); }
        .header-right strong { color: var(--success); }
        .dashboard { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 20px 15px 50px 15px; gap: 20px; }
        .panel { width: 100%; max-width: 1000px; background: var(--panel); border: 1px solid var(--border); border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); height: fit-content; }
        .panel-header { background: rgba(0, 0, 0, 0.4); padding: 15px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .panel-header h2 { font-size: 1.2rem; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }
        .status-badge { font-size: 0.85rem; padding: 6px 15px; border-radius: 20px; background: rgba(255, 84, 112, 0.2); color: var(--danger); font-weight: bold; border: 1px solid var(--danger); }
        .status-badge.active { background: rgba(0, 255, 157, 0.2); color: var(--success); border-color: var(--success); }
        .status-badge.recording { background: rgba(255, 84, 112, 0.2); color: var(--danger); border-color: var(--danger); animation: pulse 1s infinite; }
        #videoContainer { position: relative; background: #000; width: 100%; height: 50vh; min-height: 300px; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        #videoFeed { width: 100%; height: 100%; object-fit: contain; display: none; }
        .camera-offline { color: var(--text-muted); text-align: center; font-size: 1.2rem; padding: 20px; line-height: 1.6; position: absolute; }
        .rec-indicator { position: absolute; top: 20px; right: 20px; color: var(--danger); font-weight: bold; font-size: 1.2rem; display: none; background: rgba(0,0,0,0.8); padding: 8px 15px; border-radius: 8px; align-items: center; gap: 10px; border: 1px solid var(--danger); z-index: 10; }
        .rec-indicator.active { display: flex; }
        .rec-dot { width: 15px; height: 15px; background: var(--danger); border-radius: 50%; animation: pulse 1s infinite; }
        .controls { background: rgba(0, 0, 0, 0.9); border-top: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .cam-select { width: 100%; padding: 12px; border-radius: 8px; background: rgba(0,0,0,0.5); color: var(--accent); border: 1px solid var(--border); outline: none; font-size: 1rem; }
        .button-grid { display: flex; gap: 15px; width: 100%; justify-content: center; flex-wrap: wrap; }
        button { background: var(--accent); color: #000; border: none; padding: 15px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; text-transform: uppercase; font-size: 0.95rem; flex: 1; min-width: 140px; }
        button:hover { background: #00b8cc; box-shadow: 0 0 15px rgba(0,229,255,0.4); }
        button.danger { background: var(--danger); color: white; } button.danger:hover { background: #d13a52; }
        button.warning { background: var(--gold); color: #000; } button.warning:hover { background: #e0a800; }
        button.purple { background: var(--purple); color: white; } button.purple:hover { background: #7c3aed; }
        button:disabled { background: var(--text-muted); cursor: not-allowed; box-shadow: none; }
        .btn-permission { background: var(--gold); color: black; width: 100%; }
        .ai-panel { border: 1px solid var(--purple); box-shadow: 0 0 20px rgba(139, 92, 246, 0.2); }
        .ai-panel .panel-header h2 { color: var(--purple); }
        .ai-display { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 20px; }
        .ai-box { background: rgba(0,0,0,0.5); border: 1px solid var(--border); border-radius: 8px; padding: 15px; min-height: 120px; }
        .ai-box h3 { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 10px; }
        .ai-box p { font-size: 1.1rem; line-height: 1.5; color: var(--text-main); }
        .ai-controls { padding: 0 20px 20px 20px; display: flex; gap: 10px; flex-wrap: wrap; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        @keyframes listening { 0% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(139, 92, 246, 0); } 100% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0); } }
        .listening-active { animation: listening 1.5s infinite; background: var(--purple) !important; color: white !important; }
        @media (max-width: 768px) { header { flex-direction: column; gap: 10px; padding: 15px; } .header-left, .header-center, .header-right { text-align: center; width: 100%; } .time-display { font-size: 1.5rem; } .button-grid, .ai-controls { flex-direction: column; } button { width: 100%; } #videoContainer { height: 40vh; } .ai-display { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <header>
        <div class="header-left"><h1>🛡️ J.A.R.V.I.S. AI HOST</h1></div>
        <div class="header-center"><div class="time-display" id="liveTime">00:00:00</div><div class="date-display" id="liveDate">Loading...</div></div>
        <div class="header-right"><strong>Operator:</strong> Gesner Deslandes<br>Software Engineer</div>
    </header>

    <div class="dashboard">
        <div class="panel">
            <div class="panel-header"><h2>📷 USB Camera Feed</h2><div class="status-badge" id="camStatus">OFFLINE</div></div>
            <div id="videoContainer">
                <div class="camera-offline" id="camOfflineText">Click "Allow" to start camera.</div>
                <video id="videoFeed" autoplay playsinline muted></video>
                <div class="rec-indicator" id="recIndicator"><div class="rec-dot"></div> RECORDING</div>
            </div>
            <div class="controls">
                <button class="btn-permission" onclick="requestCameraPermission()">🔐 Allow & Find Cameras</button>
                <div style="display:flex; gap:10px;">
                    <select id="cameraSelect" class="cam-select" disabled style="flex: 1;"><option value="">Please allow permission first...</option></select>
                    <button onclick="requestCameraPermission()" style="flex: 0; min-width: 100px; padding: 10px;">🔄 Refresh</button>
                </div>
                <div class="button-grid">
                    <button id="btnCam" onclick="toggleCamera()" disabled>Start Camera</button>
                    <button id="btnMute" onclick="toggleMute()" disabled>🔊 Unmute</button>
                    <button id="btnRecord" onclick="toggleRecording()" disabled>🔴 Record Video</button>
                </div>
            </div>
        </div>

        <div class="panel ai-panel">
            <div class="panel-header"><h2>🧠 J.A.R.V.I.S. AI INTERACTION</h2><div class="status-badge" id="aiStatus">STANDBY</div></div>
            <div class="ai-display">
                <div class="ai-box"><h3>🎤 Audience Speech</h3><p id="aiTranscription">Click "Listen" and speak...</p></div>
                <div class="ai-box" style="border-color: var(--purple);"><h3>🤖 J.A.R.V.I.S. Reply</h3><p id="aiReply">Ready to interact.</p></div>
            </div>
            <div class="ai-controls">
                <button id="btnListen" class="purple" onclick="toggleListening()" disabled>🎤 Listen (Microphone)</button>
                <button id="btnAsk" class="warning" onclick="askJarvis()" disabled>🚀 Ask J.A.R.V.I.S.</button>
                <button id="btnSpeakAgain" class="ghost" onclick="speakReply()" style="background: transparent; border: 1px solid var(--purple); color: var(--purple);" disabled>🔊 Repeat Voice</button>
            </div>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            document.getElementById('liveTime').innerText = now.toLocaleTimeString('en-US', { hour12: false });
            document.getElementById('liveDate').innerText = now.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }
        setInterval(updateClock, 1000); updateClock();

        let videoStream = null, isMuted = true, mediaRecorder = null, recordedChunks = [];
        const videoElement = document.getElementById('videoFeed'), camStatus = document.getElementById('camStatus'), btnCam = document.getElementById('btnCam'), btnMute = document.getElementById('btnMute'), btnRecord = document.getElementById('btnRecord'), cameraSelect = document.getElementById('cameraSelect'), recIndicator = document.getElementById('recIndicator'), btnListen = document.getElementById('btnListen'), btnAsk = document.getElementById('btnAsk');

        async function requestCameraPermission() {
            cameraSelect.innerHTML = '<option value="">Requesting...</option>';
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                stream.getTracks().forEach(track => track.stop());
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(device => device.kind === 'videoinput');
                cameraSelect.innerHTML = ''; cameraSelect.disabled = false;
                if (videoDevices.length === 0) { cameraSelect.innerHTML = '<option value="">No cameras found</option>'; return; }
                videoDevices.forEach((device, index) => {
                    const option = document.createElement('option'); option.value = device.deviceId; option.text = device.label || `Camera ${index + 1}`; cameraSelect.appendChild(option);
                });
                btnCam.disabled = false; document.getElementById('camOfflineText').innerHTML = "Camera found! Click <b>Start Camera</b>.";
            } catch (err) { cameraSelect.innerHTML = '<option value="">Denied</option>'; document.getElementById('camOfflineText').innerHTML = "<span style='color:red'>Permission Denied.</span>"; }
        }

        async function toggleCamera() {
            if (videoStream) {
                if (mediaRecorder && mediaRecorder.state === 'recording') stopRecording();
                videoStream.getTracks().forEach(track => track.stop()); videoElement.srcObject = null; videoElement.style.display = 'none';
                document.getElementById('camOfflineText').style.display = 'block'; camStatus.innerText = "OFFLINE"; camStatus.className = "status-badge";
                btnCam.innerText = "Start Camera"; btnMute.disabled = true; btnRecord.disabled = true; btnListen.disabled = true;
            } else {
                const selectedId = cameraSelect.value; if (!selectedId) return;
                try { videoStream = await navigator.mediaDevices.getUserMedia({ video: { deviceId: { exact: selectedId } }, audio: { echoCancellation: true, noiseSuppression: true } }); }
                catch (e1) { try { videoStream = await navigator.mediaDevices.getUserMedia({ video: { deviceId: { exact: selectedId } } }); } catch (e2) { alert("Camera busy."); return; } }
                videoElement.srcObject = videoStream; videoElement.style.display = 'block'; document.getElementById('camOfflineText').style.display = 'none';
                videoElement.muted = true; isMuted = true; btnMute.innerHTML = "🔊 Unmute"; btnMute.disabled = false; btnRecord.disabled = false; btnListen.disabled = false;
                await videoElement.play(); camStatus.innerText = "LIVE"; camStatus.className = "status-badge active"; btnCam.innerText = "Stop Camera";
            }
        }

        function toggleMute() { if (!videoStream) return; isMuted = !isMuted; const audioTrack = videoStream.getAudioTracks()[0]; if (audioTrack) audioTrack.enabled = !isMuted; videoElement.muted = isMuted; btnMute.innerHTML = isMuted ? "🔊 Unmute" : "🔇 Mute"; }
        function toggleRecording() { if (mediaRecorder && mediaRecorder.state === 'recording') { stopRecording(); } else { startRecording(); } }
        function startRecording() {
            recordedChunks = []; let options = { mimeType: 'video/mp4' }; let fileExt = 'mp4';
            if (!MediaRecorder.isTypeSupported(options.mimeType)) { options = { mimeType: 'video/webm' }; fileExt = 'webm'; }
            mediaRecorder = new MediaRecorder(videoStream, options);
            mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType }); const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = `JARVIS_Rec_${Date.now()}.${fileExt}`; a.click();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            };
            mediaRecorder.start(1000); recIndicator.classList.add('active'); btnRecord.innerHTML = "⏹ Stop"; btnRecord.classList.add('warning'); camStatus.innerText = "RECORDING"; camStatus.className = "status-badge recording";
        }
        function stopRecording() { if (mediaRecorder) mediaRecorder.stop(); recIndicator.classList.remove('active'); btnRecord.innerHTML = "🔴 Record Video"; btnRecord.classList.remove('warning'); camStatus.innerText = "LIVE"; camStatus.className = "status-badge active"; }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null, isListening = false, transcriptBuffer = "", isJarvisSpeaking = false, echoCooldownTimer = null;
        const aiStatus = document.getElementById('aiStatus'), aiTranscription = document.getElementById('aiTranscription'), aiReply = document.getElementById('aiReply'), btnSpeakAgain = document.getElementById('btnSpeakAgain');

        if (SpeechRecognition) {
            recognition = new SpeechRecognition(); recognition.continuous = true; recognition.interimResults = true; recognition.lang = 'en-US';
            recognition.onstart = () => { isListening = true; aiStatus.innerText = "LISTENING..."; aiStatus.className = "status-badge active"; btnListen.innerHTML = "🛑 Stop"; btnListen.classList.add('listening-active'); aiTranscription.innerText = "Listening..."; };
            recognition.onresult = (event) => {
                if (isJarvisSpeaking) return;
                let interim = ''; for (let i = event.resultIndex; i < event.results.length; ++i) { if (event.results[i].isFinal) { transcriptBuffer += event.results[i][0].transcript + ' '; } else { interim += event.results[i][0].transcript; } }
                aiTranscription.innerText = transcriptBuffer + interim; btnAsk.disabled = false;
            };
            recognition.onerror = (e) => { stopListening(); aiTranscription.innerText = "Error hearing you."; };
        }

        function toggleListening() { if (isListening) { stopListening(); } else { transcriptBuffer = ""; aiTranscription.innerText = "Listening..."; recognition.start(); } }
        function stopListening() { isListening = false; if (recognition) recognition.stop(); aiStatus.innerText = "STANDBY"; aiStatus.className = "status-badge"; btnListen.innerHTML = "🎤 Listen"; btnListen.classList.remove('listening-active'); }

        async function askJarvis() {
            const finalSpeech = aiTranscription.innerText.trim(); if (!finalSpeech || finalSpeech.includes("Listening...")) return;
            stopListening(); btnAsk.disabled = true;
            if (videoStream && videoStream.getAudioTracks()[0]) videoStream.getAudioTracks()[0].enabled = false;
            aiStatus.innerText = "PROCESSING..."; aiReply.innerText = "Analyzing...";
            const systemPrompt = `You are J.A.R.V.I.S. Audience said: "${finalSpeech}". Answer directly. Offer ONE proactive idea. Keep it 2-3 sentences max.`;
            try {
                const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(systemPrompt)}`);
                aiReply.innerText = await response.text(); aiStatus.innerText = "REPLYING..."; speakReply(); btnSpeakAgain.disabled = false;
            } catch (error) { aiReply.innerText = "Network error."; aiStatus.innerText = "ERROR"; }
        }

        function speakReply() {
            const textToSpeak = aiReply.innerText; if (!textToSpeak || textToSpeak.includes("Analyzing")) return;
            window.speechSynthesis.cancel(); const utterance = new SpeechSynthesisUtterance(textToSpeak); utterance.lang = 'en-US'; utterance.rate = 1.05;
            utterance.onstart = () => { isJarvisSpeaking = true; if (videoStream && videoStream.getAudioTracks()[0]) videoStream.getAudioTracks()[0].enabled = false; aiStatus.innerText = "SPEAKING..."; aiStatus.className = "status-badge recording"; };
            utterance.onend = () => { aiStatus.innerText = "STANDBY"; aiStatus.className = "status-badge"; clearTimeout(echoCooldownTimer); echoCooldownTimer = setTimeout(() => { isJarvisSpeaking = false; if (videoStream && videoStream.getAudioTracks()[0]) videoStream.getAudioTracks()[0].enabled = !isMuted; }, 2000); };
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
