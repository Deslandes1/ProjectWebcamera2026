<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. Live GPS Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #0f172a; margin: 0; }
        .dark-map { filter: invert(0.9) hue-rotate(180deg) contrast(1.2); }
    </style>
</head>
<body class="min-h-screen text-slate-200 p-6 font-sans">

    <header class="mb-8 border-b border-slate-800 pb-4 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold text-cyan-400 tracking-wider flex items-center gap-3">
                <i data-lucide="shield" class="w-8 h-8"></i> J.A.R.V.I.S. SECURITY CENTER
            </h1>
            <p class="text-sm text-slate-500 mt-1 flex items-center gap-2">
                <i data-lucide="smartphone" class="w-4 h-4"></i> Live iPhone Student Tracker
            </p>
        </div>
        <button onclick="fetchGpsLocation()" class="flex items-center gap-2 bg-slate-900 hover:bg-slate-800 border border-slate-700 px-4 py-2 rounded-lg text-sm font-semibold transition-colors">
            <i data-lucide="refresh-cw" class="w-4 h-4"></i> Sync Now
        </button>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Status Panel -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-6 shadow-xl">
            <div class="flex justify-between items-center">
                <h2 class="text-sm font-semibold tracking-wide text-slate-300 uppercase flex items-center gap-2">
                    <i data-lucide="cpu" class="w-4 h-4 text-cyan-400"></i> Tracker Status
                </h2>
                <span id="status-badge" class="px-2.5 py-0.5 text-xs font-semibold bg-slate-500/10 text-slate-400 border border-slate-500/20 rounded-full">
                    WAITING...
                </span>
            </div>

            <div class="space-y-4">
                <div class="bg-slate-950/50 p-3 rounded-lg border border-slate-800">
                    <p class="text-xs text-slate-500 uppercase mb-1">Device</p>
                    <p class="text-sm font-medium text-slate-200">Student iPhone / Smartphone</p>
                </div>

                <div class="bg-slate-950/50 p-3 rounded-lg border border-slate-800 space-y-2">
                    <div class="flex items-center space-x-2 text-slate-400">
                        <i data-lucide="map-pin" class="w-4 h-4 text-red-400"></i>
                        <span class="text-xs">Live GPS Coordinates</span>
                    </div>
                    <div id="coords" class="font-mono text-sm text-cyan-300">
                        Lat: --<br />
                        Lng: --
                    </div>
                </div>

                <div class="flex justify-between items-center text-xs text-slate-500 pt-2 border-t border-slate-800">
                    <span>Last Pulse:</span>
                    <span id="last-updated" class="text-slate-300 font-mono">Never</span>
                </div>
            </div>
        </div>

        <!-- Map -->
        <div class="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-xl overflow-hidden flex flex-col h-[500px] shadow-xl">
            <div class="bg-slate-950 px-4 py-3 border-b border-slate-800 flex justify-between items-center">
                <span class="text-xs font-semibold text-slate-300 tracking-wider uppercase flex items-center gap-2">
                    <i data-lucide="radio" class="w-4 h-4 text-cyan-400 animate-pulse"></i> Live Geolocation Feed
                </span>
                <span class="text-xs text-slate-500">Updates every 3s</span>
            </div>

            <div class="flex-1 relative bg-slate-950">
                <iframe
                    id="map-frame"
                    title="GPS Tracker Map"
                    class="w-full h-full dark-map border-0"
                    src="https://www.openstreetmap.org/export/embed.html?bbox=-72.34%2C18.53%2C-72.32%2C18.55&layer=mapnik"
                ></iframe>
                
                <div class="absolute top-4 left-4 bg-slate-900/90 backdrop-blur border border-slate-700 p-3 rounded-lg shadow-xl text-xs space-y-1">
                    <div class="font-bold text-cyan-400 flex items-center gap-1.5">
                        <span id="live-dot" class="w-2 h-2 rounded-full bg-slate-500"></span>
                        <span id="live-text">Waiting for GPS...</span>
                    </div>
                    <div class="text-slate-300">Target Location</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // URL Firebase ou a mete ajou isit la
        const FIREBASE_URL = "https://jarvis-tracker-a8136-default-rtdb.firebaseio.com";
        
        // Kòmanse ikòn yo
        lucide.createIcons();

        async function fetchGpsLocation() {
            try {
                const response = await fetch(`${FIREBASE_URL}/student_location.json`);
                const data = await response.json();

                if (!data || !data.lat || !data.lng) {
                    console.log("Pa gen done pou kounye a...");
                    return;
                }

                // 1. Mete ajou kowòdone yo
                document.getElementById('coords').innerHTML = `
                    Lat: ${data.lat.toFixed(5)}<br />
                    Lng: ${data.lng.toFixed(5)}
                `;

                // 2. Mete ajou lè a
                const time = new Date(data.timestamp).toLocaleTimeString();
                document.getElementById('last-updated').innerText = time;

                // 3. Mete ajou kat la (iframe)
                const offset = 0.005; // Nivo zoom
                const bbox = `${data.lng - offset}%2C${data.lat - offset}%2C${data.lng + offset}%2C${data.lat + offset}`;
                const mapUrl = `https://www.openstreetmap.org/export/embed.html?bbox=${bbox}&layer=mapnik&marker=${data.lat}%2C${data.lng}`;
                
                document.getElementById('map-frame').src = mapUrl;

                // 4. Chanje koulè "Status" lan
                const badge = document.getElementById('status-badge');
                badge.innerText = "ONLINE";
                badge.className = "px-2.5 py-0.5 text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-full";

                document.getElementById('live-dot').className = "w-2 h-2 rounded-full bg-emerald-400 animate-ping";
                document.getElementById('live-text').innerText = "Live Tracker Active";

            } catch (error) {
                console.error("Erè koneksyon ak Firebase:", error);
            }
        }

        // Chèche done yo chak 3 segond
        setInterval(fetchGpsLocation, 3000);
        fetchGpsLocation(); // Kouri l touswit
    </script>
</body>
</html>
