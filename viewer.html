<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. Live Feed Viewer</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { background-color: #050a14; color: #00e5ff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden;}
        h1 { font-size: 1.5rem; letter-spacing: 2px; }
        #videoContainer { width: 90%; max-width: 800px; border: 2px solid #00e5ff; border-radius: 12px; overflow: hidden; box-shadow: 0 0 20px rgba(0,229,255,0.3); background: black; }
        video { width: 100%; height: 100%; display: block; }
        .status { margin-top: 15px; font-weight: bold; color: #ffc244; }
    </style>
</head>
<body>
    <h1>🛡️ J.A.R.V.I.S. LIVE FEED</h1>
    <div id="videoContainer">
        <video id="remoteVideo" autoplay playsinline></video>
    </div>
    <div class="status" id="status">Connecting to Camera...</div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const peerId = urlParams.get('id');

        if (!peerId) {
            document.getElementById('status').innerText = "Error: No Camera ID found in the link.";
            document.getElementById('status').style.color = "red";
        } else {
            const peer = new Peer();

            peer.on('open', () => {
                const call = peer.call(peerId, null); 
                
                call.on('stream', (remoteStream) => {
                    document.getElementById('remoteVideo').srcObject = remoteStream;
                    document.getElementById('status').innerText = "LIVE - Connected";
                    document.getElementById('status').style.color = "#00ff9d";
                });

                call.on('error', (err) => {
                    document.getElementById('status').innerText = "Connection lost.";
                    document.getElementById('status').style.color = "red";
                });
            });
        }
    </script>
</body>
</html>
